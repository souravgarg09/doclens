# Infrastructure only. Run the API and worker natively so PyTorch can use CUDA,
# Apple MPS, or CPU on the host operating system.
#
# Every port is bound to 127.0.0.1, so the databases are reachable only from this
# computer, never from the local network. The Postgres credentials below are
# therefore local-development defaults; change them before exposing anything.
# Internal Compose project name and storage names: independent of the product name
# in brand.json, so renaming the product never orphans existing data.
name: docqa
services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docqa
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docqa"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.10.1-alpine3.23
    restart: unless-stopped
    ports: ["127.0.0.1:6379:6379"]
  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    ports: ["127.0.0.1:6333:6333", "127.0.0.1:6334:6334"]
    volumes: ["qdrant:/qdrant/storage"]
volumes:
  pgdata:   # stored as docqa_pgdata
  qdrant:   # stored as docqa_qdrant
